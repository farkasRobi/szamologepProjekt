<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>szamologep</title>
  </head>
  <body>
    <div class="placement">
    <h1 class="title">Basic számológép (most még)</h1>
    <div class="calculator">
      <div id="display" class="display">0</div>
      <div class="buttons">
        <button data-num="9">9</button>
        <button data-num="8">8</button>
        <button data-num="7">7</button>
        <button data-action="clear" class="wide">C</button>
        <button data-num="6">6</button>
        <button data-num="5">5</button>
        <button data-num="4">4</button>
        <button data-op="-">-</button>
        <button data-num="3">3</button>
        <button data-num="2">2</button>
        <button data-num="1">1</button>
        <button data-op="+">+</button>
        <button data-num="0" class="zero">0</button>
        <button data-action="dot">.</button>
        <button data-action="equals" class="wide">=</button>
      </div>
    </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
