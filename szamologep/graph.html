<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Függvényrajzoló</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs/lib/browser/math.js"></script>
    <link rel="stylesheet" href="/src/graphstyle.css">
</head>
<body>
    <div class="top-nav">
        <a class="nav-pill" href="advanced.html">Speciális</a>
        <a class="nav-pill" href="index.html">Számológép</a>
    </div>
    <div class="placement">
        <div class="calculator">
            <div class="title">Függvényrajzoló</div>
            <div class="display-wrapper">
                <button class="scroll-btn" id="zoomOut">−</button>
                <div class="display"><span class="display-text" id="display">y = sin(x)</span></div>
                <button class="scroll-btn" id="zoomIn">+</button>
            </div>
            <input id="functionInput" value="sin(x)" placeholder="Pl. sin(x), x^2 - 1, cos(x) * x" />
        </div>
        <canvas id="canvas"></canvas>
        <div id="back-panel" class="back-panel">
        </div>
    </div>
</body>
<script type="module" src="/src/graph.js"></script>
</html>
