<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Függvényrajzoló</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjs/lib/browser/math.js"></script>
    <link rel="stylesheet" href="/src/graphstyle.css">
</head>
<body>
    <div class="placement">
        <div class="calculator">
            <div class="title">Függvényrajzoló</div>
            <div class="display-wrapper">
                <button class="scroll-btn" id="zoomOut">−</button>
                <div class="display"><span class="display-text" id="display">y = sin(x)</span></div>
                <button class="scroll-btn" id="zoomIn">+</button>
            </div>
            <input id="functionInput" value="sin(x)" placeholder="Pl. sin(x), x^2 - 1, cos(x) * x" />
        </div>
        <canvas id="canvas"></canvas>
        <div id="history-panel" class="history-panel">
            <h2>Grafikon info</h2>
            <div class="history-item"><div class="history-expression" id="minText">Minimum: -</div></div>
            <div class="history-item"><div class="history-expression" id="maxText">Maximum: -</div></div>
            <div class="history-item"><div class="history-expression" id="zeroText">Zérushelyek: -</div></div>
            <button id="history-del" class="history-del">Újraszámol</button>
        </div>
    </div>
</body>
<script type="module" src="/scr/graph.js"></script>
</html>
